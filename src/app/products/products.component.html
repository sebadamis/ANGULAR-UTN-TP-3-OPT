
<body>
    <h1>PRODUCTOS</h1>

    <main class="prod-body-container">
    @if(loading){
        <span>Cargando...</span>
    }
    @else if(error){
        <span span style="color: red">Error: {{error}}</span>
    }
    @else {
        <div class="prod-list">
        @for (product of products; track product.id){
            <div class="contenedorCards">
                <div class="card">
                    <span class="id_num">{{product.id}}</span>
                    <div class="wrapper">
                        <div class="colorProd"></div>
                        <div class="imgProd"
                            style="background-image: url({{product.img}});">
                        </div>
                        <div class="infoProd">
                            <p class="nombreProd">{{product.titulo}}</p>
                            <p class="extraInfo">{{product.categoria}}</p>
                            <div class="actions">
                                <div class="preciosGrupo">
                                    <span class="precio precioOferta">${{product.precioFinal}}</span>
                                    <span class="precio precioProd">${{product.precioAntes}}</span>
                                </div>
                                <div class="icono action alCarrito">
                                    <svg class="outCart" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
                                        <title>Agregar al carrito</title>
                                        <path d="M2 6h10l10 40h32l8-24H16"></path>
                                        <circle cx="23" cy="54" r="4"></circle>
                                        <circle cx="49" cy="54" r="4"></circle>
                                    </svg>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        }
        </div>
    }
    </main>
</body>
